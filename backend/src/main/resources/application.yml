spring:
  application:
    name: portal-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal}
    password: ${SPRING_DATASOURCE_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-demo-secret-please-use-env-32chars-min}
    expiration-ms: 86400000
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  demo: true
  integrations:
    aladhan:
      enabled: ${ALADHAN_ENABLED:true}
      base-url: ${ALADHAN_BASE_URL:https://api.aladhan.com/v1}
      timeout-ms: ${ALADHAN_TIMEOUT_MS:8000}
      method: ${ALADHAN_METHOD:13}
    alquran:
      enabled: ${ALQURAN_ENABLED:true}
      base-url: ${ALQURAN_BASE_URL:https://api.alquran.cloud/v1}
      timeout-ms: ${ALQURAN_TIMEOUT_MS:10000}
      edition-ar: ${ALQURAN_EDITION_AR:quran-uthmani}
      edition-tr: ${ALQURAN_EDITION_TR:tr.diyanet}
    hadith:
      enabled: ${HADITH_API_ENABLED:true}
      base-url: ${HADITH_API_BASE_URL:https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1}
      timeout-ms: ${HADITH_API_TIMEOUT_MS:10000}
      edition: ${HADITH_API_EDITION:tur-bukhari}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
